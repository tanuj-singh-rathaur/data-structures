<h1>P12 — Sum of Two Integers</h1><div class="meta"><span class="badge">Medium</span> • LC #371</div>
<div class="section"><h2>Java</h2><pre>while (b != 0) {
    int carry = (a &amp; b) &lt;&lt; 1;
    a ^= b;
    b = carry;
}
return a;</pre></div>
<div class="section insight"><strong>Insight:</strong> XOR computes sum-without-carry; AND&lt;&lt;1 computes the carry. Loop until carry vanishes.</div></body></html>
