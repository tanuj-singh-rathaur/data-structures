<h1>P05 — LCA III (Parent Pointer)</h1><div class="meta"><span class="badge">Medium</span> • LC #1650</div>
<div class="section"><h2>Java</h2><pre>Node a = p, b = q;
while (a != b) {
    a = a.parent == null ? q : a.parent;
    b = b.parent == null ? p : b.parent;
}
return a;</pre></div>
<div class="section insight"><strong>Insight:</strong> Same technique as Linked List Intersection — pointers swap when reaching null.</div></body></html>
