<h1>P01 — Fibonacci Number</h1><div class="meta"><span class="badge">Easy</span> • LC #509</div>
<div class="section"><h2>Java (rolling)</h2><pre>int a = 0, b = 1;
for (int i = 2; i &lt;= n; i++) { int c = a + b; a = b; b = c; }
return n == 0 ? 0 : b;</pre></div>
<div class="section insight"><strong>Insight:</strong> Classic two-term recurrence. Only the last two values matter ⇒ O(1) space.</div></body></html>
