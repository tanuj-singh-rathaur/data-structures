<h1>P03 — Min Cost Climbing Stairs</h1><div class="meta"><span class="badge">Easy</span> • LC #746</div>
<div class="section"><h2>Java</h2><pre>int a = 0, b = 0;
for (int i = 2; i &lt;= n; i++) {
    int c = Math.min(b + cost[i-1], a + cost[i-2]);
    a = b; b = c;
}
return b;</pre></div>
<div class="section insight"><strong>Insight:</strong> Pay when you LEAVE a step; finish line is just past index n-1.</div></body></html>
